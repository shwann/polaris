name: CI
on: [push, pull_request]
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22.x, 24.x]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # pnpm/action-setup reads packageManager from package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check and build (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          umask 022
          pnpm check
          pnpm build
      - name: Check and build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pnpm check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify committed artifacts
        shell: bash
        run: |
          if ! git diff --exit-code -- plugin/; then
            echo '请提交构建产物'
            exit 1
          fi
