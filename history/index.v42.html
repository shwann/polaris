<title>北辰 · 研发总览</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>
/* Layout (kept from v6): cover with key figures → one-cell-per-task energy bar → lanes + sticky system log.
   Look: a command-centre HUD on deep space — chamfered glass panels, neon state colours, one live particle field. */
:root {
  color-scheme: dark;
  --bg: #03060c; --glass: rgba(9, 18, 33, .84); --glass-2: rgba(16, 30, 52, .78); --edge: rgba(70, 180, 255, .22); --edge-hi: rgba(80, 220, 255, .7);
  --ink: #eaf4ff; --ink-2: #a9bcd4; --ink-3: #7489a6;
  --cyan: #2ee6ff; --blue: #3d7bff; --coral: #ff4f6d; --amber: #ffb02e; --violet: #b07cff; --slate: #6f85a6; --green: #2cf5a0;
  --display: "Chakra Petch", "Noto Sans SC", "PingFang SC", system-ui, sans-serif;
  --sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --cut: 14px;
}
* { box-sizing: border-box }
[hidden] { display: none !important }
html { font-size: clamp(14px, .5vw + 7.5px, 23px); background: var(--bg) }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 1rem; line-height: 1.6; -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 26px 56px; overflow-x: hidden }
#field { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none }
body::before { content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  /* Nebula glow only; the chart's graticule is drawn on the canvas. */
  background: radial-gradient(1200px 700px at 12% -8%, rgba(46, 230, 255, .16), transparent 65%), radial-gradient(1100px 800px at 100% 0%, rgba(61, 123, 255, .17), transparent 60%),
    radial-gradient(1000px 680px at 50% 110%, rgba(176, 124, 255, .11), transparent 70%) }
.wrap { position: relative; z-index: 1; max-width: 2200px; margin: 0 auto; display: grid; gap: 1.4rem }

/* Chamfered glass panel with a lit edge (border drawn by a clipped gradient layer). */
/* No backdrop-filter: blurring the constantly redrawn particle canvas behind clipped panels makes Chromium repaint them visibly (flicker). */
.hud { position: relative; background: var(--glass);
  clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut)); isolation: isolate }
.hud::before { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; padding: 1px;
  background: linear-gradient(135deg, var(--edge-c, var(--edge-hi)), var(--edge) 30%, var(--edge) 70%, var(--edge-c, var(--edge-hi)));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
  clip-path: inherit }
.hud::after { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; opacity: 0; transition: opacity .3s;
  background: radial-gradient(320px circle at var(--mx, -400px) var(--my, -400px), rgba(46, 230, 255, .12), transparent 70%) }
.hud:hover::after { opacity: 1 }

/* Cover */
.cover { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1.2rem 1.6rem; align-items: end }
@media (max-width: 760px) { .cover { grid-template-columns: minmax(0, 1fr); align-items: start } }
.kicker { display: flex; align-items: center; gap: .6rem; font-family: var(--mono); font-size: .72rem; letter-spacing: .22em; color: var(--cyan) }
.kicker::before { content: ""; width: 2.2rem; height: 1px; background: linear-gradient(90deg, transparent, var(--cyan)) }
h1 { margin: .35rem 0 .3rem; font-weight: 900; font-size: clamp(2rem, 3.4vw, 3.4rem); line-height: 1.08; letter-spacing: .02em; text-wrap: balance }
h1 .en { display: block; font-family: var(--display); font-weight: 700; font-size: .5em; letter-spacing: .32em; color: transparent;
  background: linear-gradient(90deg, var(--cyan), var(--blue) 60%, var(--violet)); -webkit-background-clip: text; background-clip: text }
h1 .zh { display: block; font-size: 1.7em; line-height: 1.05; text-shadow: 0 0 28px rgba(46, 230, 255, .35); letter-spacing: .1em }
h1 .motto { display: block; margin-top: .45rem; font-size: .3em; font-weight: 500; letter-spacing: .14em; color: var(--ink-2) }
/* Big Dipper mark on each figure card: the seven cards are the seven stars, the card's own star lit. */
.fig .lab em { display: inline-flex; align-items: center; gap: .35rem; letter-spacing: .08em }
.dip { width: 2.1rem; height: .95rem; flex: none; overflow: visible }
.dip path { fill: none; stroke: currentColor; stroke-width: .45; opacity: .45 }
.dip circle { fill: currentColor; opacity: .5 }
.dip circle.me { fill: var(--c); opacity: 1; filter: drop-shadow(0 0 2px var(--c)) }
/* Narrow cards keep the star's Chinese name whole and drop the mini Dipper and Greek letter first. */
.fig { container-type: inline-size }
.fig .lab em b .gr { font-style: normal }
@container (max-width: 230px) { .fig .lab em .dip, .fig .lab em b .gr { display: none } .fig .lab { gap: .35rem } }
@container (max-width: 132px) { .fig .lab { font-size: .76rem; gap: .3rem } .fig .lab::before { display: none } }
@container (max-width: 80px) { .fig .lab em { display: none } }
@media (min-width: 961px) and (max-width: 1300px) { .fig { padding: .85rem .8rem .9rem } }
.fig .lab em b { font-family: var(--sans); font-weight: 600; font-size: 1.05em; color: color-mix(in srgb, var(--c) 70%, var(--ink-2)); letter-spacing: .12em; text-shadow: none }
.sub { display: none }
.side { display: grid; gap: .5rem; justify-items: end }
@media (max-width: 760px) { .side { justify-items: start } }
.clock { font-family: var(--display); font-weight: 600; font-size: 2.6rem; line-height: 1; letter-spacing: .08em; color: var(--ink); text-shadow: 0 0 22px rgba(46, 230, 255, .45); font-variant-numeric: tabular-nums }
.date { font-family: var(--mono); font-size: .72rem; letter-spacing: .16em; color: var(--ink-3) }
.side-row { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1rem }
.live { display: inline-flex; align-items: center; gap: .45rem; font-family: var(--mono); font-size: .74rem; letter-spacing: .14em; color: var(--ink-3) }
.live i { position: relative; width: .55rem; height: .55rem; border-radius: 50%; background: currentColor }
.live i::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 1.5px solid currentColor; opacity: 0 }
.live.on { color: var(--green) } .live.on i { box-shadow: 0 0 12px var(--green) }
.stamp { font-family: var(--mono); font-size: .72rem; color: var(--ink-3); font-variant-numeric: tabular-nums }
/* Right column, top to bottom: the all-systems completion card (opens 北辰's overview), clock, date with live status,
   actions. A narrow stack, so the header's middle stays open for 北辰 and the systems' constellations. */
.status { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: .3rem .9rem }
.cover { align-items: start }
/* 关注: three frameless rows under the clock — what needs you, the next build, overall completion; each opens its view. */
.watch { display: grid; gap: .1rem; min-width: 14.5rem; margin-top: .2rem; border-top: 1px solid rgba(120, 170, 230, .16) }
.w-row { display: grid; grid-template-columns: 3.4rem auto minmax(0, 1fr) auto; align-items: baseline; gap: .7rem; padding: .32rem .1rem; font: inherit; text-align: left; color: var(--ink-2); background: none; border: 0; border-bottom: 1px solid rgba(120, 170, 230, .1); cursor: pointer }
.w-row .k { font-size: .74rem; letter-spacing: .1em; color: var(--ink-3) }
.w-row b { font-family: var(--display); font-size: 1.05rem; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums }
.w-row .s { font-family: var(--mono); font-size: .72rem; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.w-row i { font-style: normal; color: var(--ink-3); transition: transform .2s }
.w-row:hover, .w-row:focus-visible { background: rgba(46, 230, 255, .05); outline: none } .w-row:hover i, .w-row:focus-visible i { color: var(--cyan); transform: translateX(3px) }
#w-me b { color: var(--coral) } #w-me.late .s { color: var(--coral) } #w-next b { color: var(--amber) } #pole b { color: var(--green) }
/* Latest activity under the title: one line, flashes when a new entry lands. */
.ticker { display: flex; align-items: baseline; gap: .6rem; max-width: min(21rem, 100%); margin-top: .7rem; padding: .3rem .7rem .3rem .55rem; font: inherit; font-size: .8rem; text-align: left; color: var(--ink-2); background: rgba(46, 230, 255, .05); border: 0; border-left: 2px solid rgba(46, 230, 255, .5); cursor: pointer }
.ticker i { width: .45rem; height: .45rem; flex: none; align-self: center; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green) }
.ticker .tk-k { white-space: nowrap; font-family: var(--mono); font-size: .68rem; letter-spacing: .14em; color: var(--cyan) }
.ticker time { font-family: var(--mono); font-size: .72rem; color: var(--ink-3); white-space: nowrap }
.ticker .tk-t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.ticker:hover { background: rgba(46, 230, 255, .1) }
.ticker.new { animation: tick-new 1.6s ease-out }
@keyframes tick-new { 0%, 30% { background: rgba(46, 230, 255, .3) } }
.proj .ticker { display: none }
@media (max-width: 760px) { .status { justify-content: flex-start } .watch { min-width: 0; width: 100% } }
.btn { font: 600 .74rem var(--mono); letter-spacing: .12em; color: var(--cyan); background: rgba(46, 230, 255, .08); border: 1px solid rgba(46, 230, 255, .5); padding: .38rem .8rem; cursor: pointer;
  clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px) }
.btn:hover { background: rgba(46, 230, 255, .18); box-shadow: 0 0 18px rgba(46, 230, 255, .3) }
.btn:focus-visible, summary:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px }

/* Figures */
/* System switcher: one tab per system (a constellation each); the cards, matrix and lists below show the chosen one. */
/* One bar: system tabs on the left (they scroll sideways once there are many), view buttons on the right. */
.tabbar { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: .5rem 1.2rem; border-bottom: 1px solid rgba(120, 170, 230, .18); margin-top: .4rem }
.tabbar .side-row { flex: none; padding-bottom: .45rem }
.systems { flex: 1 1 18rem; min-width: 0; display: flex; flex-wrap: nowrap; align-items: flex-end; gap: .2rem .3rem; overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: none;
  -webkit-mask: linear-gradient(90deg, #000 calc(100% - 2rem), transparent); mask: linear-gradient(90deg, #000 calc(100% - 2rem), transparent) }
.systems::-webkit-scrollbar { display: none }
.systems > * { flex: none }
.systems button { display: inline-flex; align-items: baseline; gap: .55rem; font: inherit; font-size: .9rem; color: var(--ink-2); background: none; border: 1px solid transparent; border-bottom: 2px solid transparent; margin-bottom: -1px; padding: .5rem 1rem; cursor: pointer }
.systems button .c { font-family: var(--mono); font-size: .72rem; letter-spacing: .12em; color: rgb(255, 214, 140) }
.systems button .n { font-family: var(--mono); font-size: .72rem; color: var(--ink-3); font-variant-numeric: tabular-nums }
.systems button:hover { color: var(--ink) }
.systems button[aria-selected="true"] { color: var(--ink); font-weight: 600; border-color: rgba(46, 230, 255, .45); border-bottom-color: var(--cyan); background: rgba(46, 230, 255, .08) }
.systems .add { color: var(--ink-3) } .systems .add:hover { color: var(--cyan) }
.sec-h { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: .3rem 1rem; margin-top: .3rem }
.sec-h h2 { margin: 0; font-size: 1.05rem; letter-spacing: .06em }
.systems button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px }
.systems .more { font-size: .76rem; color: var(--ink-3) }
.proj .systems .more { display: none }
.figures { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: .8rem }
@media (max-width: 960px) { .figures { grid-template-columns: repeat(4, minmax(0, 1fr)) } }
@media (max-width: 560px) { .figures { grid-template-columns: repeat(2, minmax(0, 1fr)) } }
/* Column flex so label, figure and note sit at the same height in every card of a row, and the meter pins to the bottom. */
.fig { --edge-c: var(--c); padding: 1rem 1.15rem 1.05rem; display: flex; flex-direction: column; gap: .4rem; min-width: 0; transition: transform .25s }
.fig:hover { transform: translateY(-3px) }
.fig .lab { display: flex; align-items: center; gap: .5rem; font-size: .82rem; color: var(--ink-2); white-space: nowrap; min-width: 0 }
.proj .fig .lab em { display: none }
.fig .lab::before { content: ""; width: .5rem; height: .5rem; transform: rotate(45deg); background: var(--c); box-shadow: 0 0 10px var(--c) }
.fig .lab em { margin-left: auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-style: normal; font-family: var(--mono); font-size: .62rem; letter-spacing: .16em; color: var(--ink-3) }
.fig b { font-family: var(--display); font-weight: 700; font-size: 3rem; line-height: 1; color: var(--c); text-shadow: 0 0 24px color-mix(in srgb, var(--c) 60%, transparent); font-variant-numeric: tabular-nums; overflow-wrap: anywhere }
.fig small { font-size: .74rem; line-height: 1.5; color: var(--ink-3) }
.fig small .sg { white-space: nowrap } .fig small .dot { white-space: normal; color: var(--ink-3); opacity: .7 }
.seg { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; margin-top: auto; padding-top: .45rem }
.seg i { height: .32rem; background: rgba(120, 170, 230, .14); transform: skewX(-20deg) }
.seg i.on { background: var(--c); box-shadow: 0 0 8px var(--c) }

/* Energy bar: one cell per task */
.ribbon { padding: 1rem 1.2rem 1.05rem; display: grid; gap: .8rem }
.ribbon-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: .4rem 1rem }
.ribbon-h .t { font-weight: 700; font-size: 1rem }
.ribbon-h .tag, .lane-h .tag, aside .tag { font-family: var(--mono); font-size: .64rem; letter-spacing: .2em; color: var(--cyan) }
.ribbon-h .ratio { margin-left: auto; background: none; border: 0; padding: 0; cursor: pointer; font-family: var(--display); font-size: 1.6rem; font-weight: 700; color: var(--green); text-shadow: 0 0 16px rgba(44, 245, 160, .5); font-variant-numeric: tabular-nums }
.ribbon-h .ratio small { font-size: .55em; color: var(--ink-3); margin-left: .2rem }
/* One row, one cell per task; on narrow screens fall back to wrapping. */
.cells { display: grid; grid-template-columns: repeat(var(--n, 40), minmax(0, 1fr)); gap: 4px }
@media (max-width: 720px) { .cells { grid-template-columns: repeat(auto-fill, minmax(12px, 1fr)) } }
.cells i { height: 2.1rem; background: color-mix(in srgb, var(--c) 78%, transparent); box-shadow: 0 0 10px color-mix(in srgb, var(--c) 55%, transparent), inset 0 0 0 1px color-mix(in srgb, #fff 18%, transparent);
  transform: skewX(-16deg); transition: transform .15s, opacity .15s, filter .15s; cursor: default }
.cells i.hatch { background: repeating-linear-gradient(135deg, var(--c) 0 4px, color-mix(in srgb, var(--c) 30%, transparent) 4px 8px); background-size: 22px 100% }
.cells:hover i { opacity: .35 } .cells i:hover { opacity: 1; filter: brightness(1.3); transform: skewX(-16deg) translateY(-4px) scaleY(1.15) }
.legend { display: flex; flex-wrap: wrap; gap: .3rem 1.3rem; font-size: .8rem; color: var(--ink-2) }
.legend span::before { content: ""; display: inline-block; width: .6rem; height: .6rem; transform: skewX(-16deg); background: var(--c); box-shadow: 0 0 8px var(--c); margin-right: .45rem; vertical-align: -.02em }
.legend b { font-family: var(--display); color: var(--ink); margin-left: .3rem; font-variant-numeric: tabular-nums }
.tip { position: fixed; z-index: 30; pointer-events: none; max-width: 300px; font-size: .8rem; line-height: 1.45; color: var(--ink); background: rgba(6, 14, 26, .95); border: 1px solid var(--edge-hi);
  padding: .45rem .65rem; box-shadow: 0 0 24px rgba(46, 230, 255, .25); opacity: 0; transform: translateY(4px); transition: opacity .12s, transform .12s }
.tip.on { opacity: 1; transform: none }
.tip small { display: block; color: var(--cyan); font-family: var(--mono); font-size: .7rem; margin-top: .1rem }

/* Lanes + log */
/* Digest under the matrix: what needs attention by group, and where releases stand. */
.digest { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem }
@media (max-width: 900px) { .digest { grid-template-columns: minmax(0, 1fr) } }
.dg { padding: .9rem 1.1rem .7rem; display: grid; align-content: start; gap: .2rem }
.dg h2 { margin: 0 0 .35rem; font-size: 1rem }
.dg-rows { display: grid }
.dg-row { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: baseline; gap: 1rem; padding: .5rem .1rem; font: inherit; font-size: .84rem; text-align: left; color: var(--ink-2); background: none; border: 0; border-top: 1px solid rgba(120, 170, 230, .12); cursor: pointer }
.dg-row:first-child { border-top: 0 }
.dg-row:hover, .dg-row:focus-visible { background: rgba(46, 230, 255, .05); outline: none }
.dg-row b { font-weight: 600; color: var(--c, var(--ink)); white-space: nowrap }
.dg-row span { text-align: right; font-family: var(--mono); font-size: .76rem; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.dg .none { margin: .3rem 0; font-size: .82rem; color: var(--ink-3) }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 25rem); gap: 1.6rem; align-items: start }
@media (max-width: 1000px) { .layout { grid-template-columns: minmax(0, 1fr) } }
.main { display: grid; gap: 1.6rem; min-width: 0 }
/* Below the active work, lanes sit in two columns so a projector shows them without scrolling. */
.lanes { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1.6rem; align-items: start }
.lanes > div { display: grid; gap: 1.6rem; min-width: 0 }
@media (max-width: 1300px) { .lanes { grid-template-columns: minmax(0, 1fr) } }
@media (min-width: 1301px) { .lanes .row { padding: .8rem 1.05rem } }
.lane-h { display: flex; align-items: center; gap: .7rem; margin: 0 0 .7rem }
.lane-h .bar { width: .28rem; height: 1.25rem; background: var(--c); box-shadow: 0 0 12px var(--c); transform: skewX(-16deg) }
.lane-h .name { font-size: 1.12rem; font-weight: 700 }
.lane-h .n { font-family: var(--display); font-weight: 700; font-size: .95rem; color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 55%, transparent); padding: 0 .55rem; font-variant-numeric: tabular-nums }
.lane-h .hint { margin-left: auto; font-size: .8rem; color: var(--ink-3) }

.active { --edge-c: var(--cyan); padding: 1.2rem 1.35rem; display: grid; gap: 1rem }
.a-top { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem 1rem }
.a-code { font-family: var(--mono); font-size: .76rem; color: var(--bg); background: var(--cyan); padding: .05rem .5rem; box-shadow: 0 0 14px rgba(46, 230, 255, .5) }
.a-title { font-weight: 900; font-size: 1.32rem; line-height: 1.3; overflow-wrap: anywhere }
.a-pct { margin-left: auto; font-family: var(--display); font-weight: 700; font-size: 2.6rem; line-height: 1; color: var(--cyan); text-shadow: 0 0 22px rgba(46, 230, 255, .6); font-variant-numeric: tabular-nums }
.a-pct small { font-size: .45em; margin-left: .1rem }
.meter { height: .4rem; background: rgba(120, 170, 230, .12); position: relative; overflow: hidden }
.meter i { position: absolute; inset: 0 auto 0 0; width: var(--p, 0%); background: linear-gradient(90deg, var(--blue), var(--cyan)); box-shadow: 0 0 14px var(--cyan); transition: width 1.2s cubic-bezier(.2, .8, .2, 1) }
.meter i::after { content: ""; position: absolute; right: 0; top: -3px; bottom: -3px; width: 3px; background: #fff; box-shadow: 0 0 10px #fff, 0 0 20px var(--cyan) }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(7rem, 1fr)); gap: .55rem }
.step { display: grid; gap: .35rem; min-width: 0; padding: .55rem .65rem; background: rgba(120, 170, 230, .06); border: 1px solid rgba(120, 170, 230, .14) }
.step em { font-style: normal; font-family: var(--mono); font-size: .64rem; letter-spacing: .16em; color: var(--ink-3) }
.step b { font-size: .9rem; font-weight: 600; overflow-wrap: anywhere }
.step.done { border-color: rgba(44, 245, 160, .4); background: rgba(44, 245, 160, .07) } .step.done em { color: var(--green) }
.step.doing { border-color: var(--cyan); background: linear-gradient(90deg, rgba(46, 230, 255, .16), rgba(46, 230, 255, .04)); box-shadow: 0 0 18px rgba(46, 230, 255, .25), inset 0 0 12px rgba(46, 230, 255, .12) }
.step.doing em { color: var(--cyan) } .step.doing em::after { content: " ▮"; }
.step.blocked { border-color: rgba(255, 79, 109, .5) } .step.blocked em { color: var(--coral) }
.a-detail { margin: 0; color: var(--ink-2); font-size: .92rem }
.ref { font-family: var(--mono); font-size: .7rem; color: var(--ink-3); overflow-wrap: anywhere }

.rows { display: grid }
/* Code and status share the top line; the body gets the full card width so long statuses never squeeze the text. */
